<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Submit Task - TaskEarn</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#070b18;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

.header{
    position:sticky;
    top:0;
    z-index:100;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:14px 16px;

    background:rgba(8,12,27,.96);
    backdrop-filter:blur(15px);

    border-bottom:1px solid #202744;
}

.header-left{
    display:flex;
    align-items:center;
    gap:12px;
}

.back-btn{
    width:46px;
    height:46px;

    border:1px solid #34405f;
    border-radius:15px;

    background:#151b2d;
    color:#fff;

    font-size:24px;
}

.logo{
    font-size:20px;
    font-weight:900;
}

.logo span{
    color:#ffbd00;
}

.wallet-btn{
    border:1px solid #4b5577;
    background:#151b2d;
    color:#fff;
    border-radius:14px;
    padding:10px 13px;
    font-weight:800;
}

.wallet-btn span{
    color:#ffd000;
}

.container{
    width:100%;
    max-width:760px;
    margin:auto;
    padding:24px 16px 100px;
}

.loading{
    text-align:center;
    padding:80px 20px;
    color:#aeb7cc;
}

.spinner{
    width:45px;
    height:45px;

    margin:0 auto 18px;

    border:5px solid #252c42;
    border-top-color:#20cfff;
    border-right-color:#704cff;

    border-radius:50%;

    animation:spin 1s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.card{
    padding:22px;

    border-radius:23px;

    background:#101627;

    border:1px solid #252f4b;

    margin-bottom:17px;
}

.task-card{
    background:
        radial-gradient(
            circle at top right,
            rgba(112,76,255,.25),
            transparent 40%
        ),
        linear-gradient(
            135deg,
            #10233e,
            #181b42
        );

    border:1px solid #31527d;
}

.label{
    color:#7f8ba6;

    font-size:11px;

    font-weight:900;

    text-transform:uppercase;

    margin-bottom:7px;
}

.task-title{
    margin:0 0 10px;

    font-size:25px;

    line-height:1.3;
}

.reward{
    color:#ffd000;

    font-size:25px;

    font-weight:900;
}

.description{
    color:#aeb8ce;

    line-height:1.65;

    font-size:14px;

    margin-bottom:0;
}

h2{
    margin:0 0 17px;

    font-size:20px;
}

textarea,
input{
    width:100%;

    border:1px solid #303b58;

    border-radius:14px;

    background:#080d1b;

    color:#fff;

    padding:14px;

    outline:none;

    font-size:14px;
}

textarea{
    min-height:150px;

    resize:vertical;

    line-height:1.6;
}

textarea:focus,
input:focus{
    border-color:#20cfff;
}

.field{
    margin-bottom:18px;
}

.field:last-child{
    margin-bottom:0;
}

.hint{
    margin-top:7px;

    color:#707d99;

    font-size:12px;

    line-height:1.5;
}

.open-task{
    display:block;

    width:100%;

    padding:14px;

    border-radius:14px;

    background:#18233a;

    border:1px solid #304467;

    color:#4edcff;

    text-decoration:none;

    text-align:center;

    font-weight:900;
}

.submit-btn{
    width:100%;

    border:0;

    border-radius:16px;

    padding:17px;

    background:
        linear-gradient(
            90deg,
            #18cfff,
            #704cff
        );

    color:#fff;

    font-size:16px;

    font-weight:900;
}

.submit-btn:disabled{
    opacity:.5;
}

.warning{
    padding:14px;

    border-radius:14px;

    background:#211b0d;

    border:1px solid #4d3b13;

    color:#cdbd8b;

    font-size:13px;

    line-height:1.6;
}

.success{
    text-align:center;

    padding:35px 20px;

    border-radius:22px;

    background:#101b20;

    border:1px solid #245c5b;
}

.success-icon{
    font-size:50px;

    margin-bottom:12px;
}

.success h2{
    margin-bottom:8px;
}

.success p{
    color:#9caac0;

    line-height:1.6;
}

.success-btn{
    display:block;

    margin-top:20px;

    padding:14px;

    border-radius:14px;

    background:#18233a;

    color:#fff;

    text-decoration:none;

    font-weight:900;
}

.error{
    text-align:center;

    padding:45px 20px;

    border-radius:22px;

    background:#101627;

    border:1px solid #4b2932;
}

.error p{
    color:#9da8bf;

    line-height:1.6;
}

.retry-btn{
    border:0;

    padding:13px 20px;

    border-radius:13px;

    background:#ffbd00;

    color:#111;

    font-weight:900;
}

.footer{
    margin-top:30px;

    padding:25px 0 10px;

    border-top:1px solid #202744;
}

.footer-logo{
    font-size:20px;
    font-weight:900;
    margin-bottom:15px;
}

.footer-logo span{
    color:#ffbd00;
}

.footer-links{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:9px;
}

.footer-link{
    display:block;

    padding:11px;

    border-radius:12px;

    background:#101627;

    border:1px solid #222c47;

    color:#aeb8ce;

    text-decoration:none;

    font-size:13px;

    font-weight:700;
}

.copyright{
    margin-top:18px;

    color:#68738e;

    font-size:12px;

    text-align:center;

    text-align:center;
}

@media(max-width:500px){

    .task-title{
        font-size:23px;
    }

    .card{
        padding:18px;
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="header-left">

        <button
            class="back-btn"
            onclick="goBack()">
            ←
        </button>

        <div class="logo">
            Task<span>Earn</span>
        </div>

    </div>

    <button
        class="wallet-btn"
        onclick="openPage('wallet.html')">

        💰 <span>Wallet</span>

    </button>

</header>


<main class="container">

    <div id="content">

        <div class="loading">

            <div class="spinner"></div>

            <h3>
                Loading task...
            </h3>

            <p>
                Please wait.
            </p>

        </div>

    </div>


    <footer class="footer">

        <div class="footer-logo">
            Task<span>Earn</span>
        </div>

        <div class="footer-links">

            <a class="footer-link" href="index.html">
                🏠 Home
            </a>

            <a class="footer-link" href="tasks.html">
                📋 Tasks
            </a>

            <a class="footer-link" href="projects.html">
                🚀 Projects
            </a>

            <a class="footer-link" href="wallet.html">
                💰 Wallet
            </a>

            <a class="footer-link" href="withdraw.html">
                💸 Withdraw
            </a>

            <a class="footer-link" href="profile.html">
                👤 Profile
            </a>

            <a class="footer-link" href="history.html">
                📜 History
            </a>

            <a class="footer-link" href="support.html">
                🆘 Support
            </a>

            <a class="footer-link" href="terms.html">
                📄 Terms
            </a>

            <a class="footer-link" href="privacy.html">
                🔐 Privacy
            </a>

        </div>

        <div class="copyright">
            © 2026 TaskEarn. All rights reserved.
        </div>

    </footer>

</main>


<script>

"use strict";


/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
"https://wfvmipwesttejtvwoasj.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_o0R1owOtbfN-YaOsR_mzRg_lgbbqbvV";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


/* ==========================================
   URL
========================================== */

const params =
new URLSearchParams(
    window.location.search
);

const taskId =
params.get("id");


/* ==========================================
   ELEMENT
========================================== */

const content =
document.getElementById("content");


let currentTask = null;
let currentUser = null;


/* ==========================================
   NAVIGATION
========================================== */

function openPage(page){

    window.location.href = page;

}


function goBack(){

    window.history.back();

}


/* ==========================================
   ESCAPE
========================================== */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ==========================================
   LOAD USER + TASK
========================================== */

async function initialize(){

    try{

        const {
            data:{
                session
            }
        } =
        await supabaseClient
            .auth
            .getSession();


        if(
            !session ||
            !session.user
        ){

            window.location.href =
                "login.html";

            return;

        }


        currentUser =
            session.user;


        if(!taskId){

            showError(
                "Task ID missing",
                "Please open this page from the Tasks page."
            );

            return;

        }


        const {
            data:task,
            error
        } =
        await supabaseClient
            .from("tasks")
            .select("*")
            .eq("id",taskId)
            .maybeSingle();


        if(error){
            throw error;
        }


        if(!task){

            showError(
                "Task not found",
                "This task is no longer available."
            );

            return;

        }


        currentTask =
            task;


        await checkExistingSubmission();


    }catch(error){

        console.error(error);

        showError(
            "Unable to load task",
            error.message ||
            "Something went wrong."
        );

    }

}


/* ==========================================
   CHECK DUPLICATE
========================================== */

async function checkExistingSubmission(){

    const {
        data,
        error
    } =
    await supabaseClient
        .from("task_completions")
        .select(
            "id,status,reward,created_at"
        )
        .eq(
            "user_id",
            currentUser.id
        )
        .eq(
            "task_id",
            taskId
        )
        .order(
            "id",
            {
                ascending:false
            }
        )
        .limit(1);


    if(error){

        /*
         * If the select is blocked by RLS,
         * continue with the submission form.
         */

        console.warn(
            "Existing submission check:",
            error
        );

        renderForm();

        return;

    }


    if(
        data &&
        data.length > 0
    ){

        const submission =
            data[0];


        const status =
            String(
                submission.status ||
                "pending"
            ).toLowerCase();


        if(
            status === "pending"
        ){

            showAlreadySubmitted(
                "⏳",
                "Submission Pending",
                "You have already submitted this task. Please wait for admin review."
            );

            return;

        }


        if(
            status === "approved"
        ){

            showAlreadySubmitted(
                "✅",
                "Task Already Approved",
                "This task has already been approved for your account."
            );

            return;

        }


        /*
         * Rejected submissions are allowed
         * to be submitted again.
         */

    }


    renderForm();

}


/* ==========================================
   FORM
========================================== */

function renderForm(){

    const reward =
        Number(
            currentTask.reward || 0
        );


    const taskUrl =
        currentTask.task_url ||
        "";


    content.innerHTML = `

        <section class="card task-card">

            <div class="label">
                Submitting Task
            </div>

            <h1 class="task-title">
                ${escapeHtml(
                    currentTask.title ||
                    "Task"
                )}
            </h1>

            <div class="reward">
                ₹${reward.toFixed(0)}
            </div>

            <p class="description">
                ${escapeHtml(
                    currentTask.description ||
                    "Complete the task and submit genuine proof."
                )}
            </p>

        </section>


        ${
            taskUrl
            ?
            `
                <section class="card">

                    <h2>
                        🔗 Task Link
                    </h2>

                    <a
                        class="open-task"
                        href="${escapeHtml(taskUrl)}"
                        target="_blank"
                        rel="noopener noreferrer">

                        🚀 Open Task

                    </a>

                </section>
            `
            :
            ""
        }


        <section class="card">

            <h2>
                📝 Submit Your Proof
            </h2>


            <div class="field">

                <div class="label">
                    Proof / Explanation
                </div>

                <textarea
                    id="proofText"
                    placeholder="Explain what you completed and provide any required details..."
                    maxlength="5000"></textarea>

                <div class="hint">
                    Maximum 5000 characters.
                    Do not submit fake information.
                </div>

            </div>


            <div class="field">

                <div class="label">
                    Proof Link (Optional)
                </div>

                <input
                    id="proofUrl"
                    type="url"
                    placeholder="https://example.com/your-proof">

                <div class="hint">
                    Add a public proof link if the task requires one.
                </div>

            </div>


            <div class="warning">

                ⚠️ <b>Important:</b>
                Submit only genuine proof.
                Fake or unrelated submissions may be rejected.

            </div>


            <button
                id="submitBtn"
                class="submit-btn"
                onclick="submitTask()">

                ✅ Submit Task

            </button>

        </section>

    `;

}


/* ==========================================
   SUBMIT
========================================== */

async function submitTask(){

    const submitBtn =
        document.getElementById(
            "submitBtn"
        );

    const proofText =
        document.getElementById(
            "proofText"
        ).value.trim();

    const proofUrl =
        document.getElementById(
            "proofUrl"
        ).value.trim();


    if(!proofText){

        alert(
            "Please enter your proof or explanation."
        );

        return;

    }


    if(proofUrl){

        try{

            new URL(proofUrl);

        }catch(error){

            alert(
                "Please enter a valid proof URL."
            );

            return;

        }

    }


    if(
        !currentUser ||
        !currentTask
    ){

        alert(
            "Session expired. Please login again."
        );

        window.location.href =
            "login.html";

        return;

    }


    submitBtn.disabled = true;

    submitBtn.textContent =
        "Submitting...";


    try{

        /*
         * Get latest session.
         */

        const {
            data:{
                session
            }
        } =
        await supabaseClient
            .auth
            .getSession();


        if(
            !session ||
            !session.user
        ){

            throw new Error(
                "Please login again."
            );

        }


        /*
         * Final duplicate check.
         */

        const {
            data:existing,
            error:existingError
        } =
        await supabaseClient
            .from("task_completions")
            .select("id,status")
            .eq(
                "user_id",
                session.user.id
            )
            .eq(
                "task_id",
                currentTask.id
            )
            .in(
                "status",
                [
                    "pending",
                    "approved"
                ]
            )
            .limit(1);


        if(existingError){
            throw existingError;
        }


        if(
            existing &&
            existing.length > 0
        ){

            showAlreadySubmitted(
                "⏳",
                "Already Submitted",
                "You already have an active submission for this task."
            );

            return;

        }


        /*
         * Insert submission.
         */

        const {
            data,
            error
        } =
        await supabaseClient
            .from("task_completions")
            .insert({

                user_id:
                    session.user.id,

                task_id:
                    currentTask.id,

                reward:
                    currentTask.reward || 0,

                status:
                    "pending",

                proof_text:
                    proofText,

                proof_url:
                    proofUrl || null,

                started_at:
                    new Date().toISOString(),

                completed_at:
                    new Date().toISOString(),

                created_at:
                    new Date().toISOString()

            })
            .select()
            .single();


        if(error){
            throw error;
        }


        console.log(
            "Submission created:",
            data
        );


        showSuccess();


    }catch(error){

        console.error(
            "Submission error:",
            error
        );


        alert(
            error.message ||
            "Submission failed. Please try again."
        );


        submitBtn.disabled =
            false;

        submitBtn.textContent =
            "✅ Submit Task";

    }

}


/* ==========================================
   SUCCESS
========================================== */

function showSuccess(){

    content.innerHTML = `

        <div class="success">

            <div class="success-icon">
                🎉
            </div>

            <h2>
                Task Submitted!
            </h2>

            <p>

                Your task has been submitted
                successfully.

                <br><br>

                Status:
                <b style="color:#ffd000;">
                    Pending Review
                </b>

                <br><br>

                Once the admin approves your
                submission, the reward will be
                processed.

            </p>


            <a
                class="success-btn"
                href="tasks.html">

                📋 Back to Tasks

            </a>


            <a
                class="success-btn"
                href="history.html">

                📜 View My History

            </a>

        </div>

    `;

}


/* ==========================================
   ALREADY SUBMITTED
========================================== */

function showAlreadySubmitted(
    icon,
    title,
    message
){

    content.innerHTML = `

        <div class="success">

            <div class="success-icon">
                ${icon}
            </div>

            <h2>
                ${escapeHtml(title)}
            </h2>

            <p>
                ${escapeHtml(message)}
            </p>


            <a
                class="success-btn"
                href="history.html">

                📜 View Submission History

            </a>


            <a
                class="success-btn"
                href="tasks.html">

                ← Back to Tasks

            </a>

        </div>

    `;

}


/* ==========================================
   ERROR
========================================== */

function showError(
    title,
    message
){

    content.innerHTML = `

        <div class="error">

            <h2>
                ⚠️
                ${escapeHtml(title)}
            </h2>

            <p>
                ${escapeHtml(message)}
            </p>

            <button
                class="retry-btn"
                onclick="window.location.href='tasks.html'">

                ← Back to Tasks

            </button>

        </div>

    `;

}


/* ==========================================
   START
========================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        initialize();

    }
);

</script>

</body>
</html>
