<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta name="theme-color" content="#071126">

<title>TaskEarn • Reset Password</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{
    min-height:100vh;
    padding:10px 8px 24px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color:#ffffff;

    background:
        radial-gradient(
            circle at 5% 0%,
            rgba(0,195,255,.20),
            transparent 32%
        ),
        radial-gradient(
            circle at 100% 100%,
            rgba(105,70,255,.22),
            transparent 38%
        ),
        linear-gradient(
            145deg,
            #061126,
            #09142d 48%,
            #050b1c
        );

    overflow-x:hidden;
}


/* =====================================================
   PAGE
===================================================== */

.page{
    width:100%;
    min-height:calc(100vh - 34px);

    display:flex;
    align-items:center;
    justify-content:center;
}


/* =====================================================
   CARD
===================================================== */

.card{
    width:100%;
    max-width:570px;

    padding:28px 24px 25px;

    position:relative;
    overflow:hidden;

    border-radius:31px;

    border:
        1px solid
        rgba(255,255,255,.16);

    background:
        linear-gradient(
            145deg,
            rgba(28,47,91,.97),
            rgba(8,17,40,.985)
        );

    box-shadow:
        0 30px 90px rgba(0,0,0,.55),
        inset 0 1px 0 rgba(255,255,255,.07);
}


.card::before{
    content:"";

    position:absolute;

    width:300px;
    height:300px;

    top:-190px;
    right:-100px;

    border-radius:50%;

    background:
        rgba(0,190,255,.13);

    filter:blur(25px);

    pointer-events:none;
}


.card::after{
    content:"";

    position:absolute;

    width:280px;
    height:280px;

    bottom:-190px;
    left:-120px;

    border-radius:50%;

    background:
        rgba(100,70,255,.15);

    filter:blur(25px);

    pointer-events:none;
}


/* =====================================================
   LOGO
===================================================== */

.logo-ring{
    width:90px;
    height:90px;

    margin:0 auto 15px;

    padding:5px;

    border-radius:28px;

    background:
        linear-gradient(
            135deg,
            #19c8ff,
            #3478ff,
            #7145ff
        );

    box-shadow:
        0 15px 45px
        rgba(39,126,255,.32);

    position:relative;
    z-index:2;
}


.logo{
    width:100%;
    height:100%;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:23px;

    background:
        linear-gradient(
            145deg,
            #172951,
            #0b1532
        );

    font-size:38px;

    box-shadow:
        inset 0 1px 0
        rgba(255,255,255,.10);
}


/* =====================================================
   BADGE
===================================================== */

.badge{
    width:max-content;

    margin:0 auto 13px;

    padding:8px 15px;

    border-radius:999px;

    border:
        1px solid
        rgba(42,205,255,.30);

    background:
        rgba(28,201,255,.07);

    color:#68dcff;

    font-size:10px;
    font-weight:900;

    letter-spacing:1px;

    position:relative;
    z-index:2;
}


/* =====================================================
   TITLE
===================================================== */

.title{
    margin:0;

    text-align:center;

    font-size:32px;
    line-height:1.15;

    font-weight:900;

    position:relative;
    z-index:2;
}


.subtitle{
    max-width:450px;

    margin:10px auto 24px;

    text-align:center;

    color:#b5c0da;

    font-size:14px;
    line-height:1.55;

    position:relative;
    z-index:2;
}


/* =====================================================
   LABEL
===================================================== */

label{
    display:block;

    margin:
        15px 3px 8px;

    color:#e3eaff;

    font-size:14px;
    font-weight:850;
}


/* =====================================================
   INPUT WRAPPER
===================================================== */

.input-wrap{
    width:100%;
    position:relative;
}


/* =====================================================
   INPUT
===================================================== */

.input{
    width:100%;
    height:56px;

    padding:
        0 68px 0 17px;

    border-radius:17px;

    border:
        1px solid
        rgba(255,255,255,.14);

    outline:none;

    background:
        linear-gradient(
            145deg,
            #26345b,
            #1b2749
        );

    color:#ffffff;

    font-size:15px;

    transition:
        border-color .2s ease,
        box-shadow .2s ease;
}


.input::placeholder{
    color:#8794b3;
}


.input:focus{
    border-color:
        rgba(52,210,255,.80);

    box-shadow:
        0 0 0 3px
        rgba(42,196,255,.09),
        0 12px 30px
        rgba(0,0,0,.16);
}


/* =====================================================
   EYE BUTTON
===================================================== */

.eye{
    position:absolute;

    right:5px;
    top:4px;

    width:48px;
    height:48px;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:0;
    margin:0;

    border:none !important;
    outline:none !important;

    border-radius:14px;

    background:
        rgba(255,255,255,.055) !important;

    color:#aebcdf;

    cursor:pointer;

    z-index:20;

    touch-action:manipulation;

    -webkit-user-select:none;
    user-select:none;

    appearance:none;
    -webkit-appearance:none;

    transition:
        background .18s ease,
        transform .15s ease,
        color .18s ease;
}


.eye:active{
    transform:scale(.90);
}


.eye.active{
    background:
        rgba(45,205,255,.12) !important;

    color:#58dcff;
}


/* =====================================================
   SVG EYE
===================================================== */

.eye svg{
    width:25px;
    height:25px;

    stroke:currentColor;

    fill:none;

    stroke-width:2;

    stroke-linecap:round;
    stroke-linejoin:round;

    pointer-events:none;
}


/* =====================================================
   STRENGTH
===================================================== */

.strength{
    display:none;

    margin-top:9px;
}


.strength-bars{
    display:flex;
    gap:5px;
}


.bar{
    flex:1;

    height:4px;

    border-radius:99px;

    background:
        rgba(255,255,255,.09);

    transition:
        background .2s ease;
}


.strength-text{
    margin-top:6px;

    color:#8190ae;

    font-size:11px;
    font-weight:700;
}


/* =====================================================
   MESSAGE
===================================================== */

.message{
    min-height:22px;

    margin:
        14px 3px 0;

    text-align:center;

    font-size:13px;
    line-height:1.45;

    font-weight:800;
}


.message.error{
    color:#ff8294;
}


.message.success{
    color:#58e4a4;
}


.message.info{
    color:#63dcff;
}


/* =====================================================
   UPDATE BUTTON
===================================================== */

.update{
    width:100%;
    height:57px;

    margin-top:18px;

    border:none;
    border-radius:18px;

    color:#ffffff;

    background:
        linear-gradient(
            100deg,
            #09baff 0%,
            #3670ff 48%,
            #7145ff 100%
        );

    font-size:17px;
    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 15px 36px
        rgba(58,91,255,.28),
        inset 0 1px 0
        rgba(255,255,255,.23);

    transition:
        transform .15s ease,
        opacity .2s ease;
}


.update:active{
    transform:scale(.985);
}


.update:disabled{
    opacity:.55;
    cursor:not-allowed;
}


/* =====================================================
   LOGIN
===================================================== */

.login{
    width:100%;
    min-height:54px;

    margin-top:11px;

    border-radius:17px;

    border:
        1px solid
        rgba(255,255,255,.14);

    background:
        rgba(255,255,255,.045);

    color:#ffffff;

    font-size:15px;
    font-weight:850;

    cursor:pointer;

    transition:
        background .2s ease,
        transform .15s ease;
}


.login:active{
    transform:scale(.985);
}


/* =====================================================
   SECURITY
===================================================== */

.security{
    display:flex;

    align-items:center;
    justify-content:center;

    gap:9px;

    margin-top:20px;

    color:#7180a0;

    font-size:11px;
    line-height:1.4;

    text-align:center;
}


.security-icon{
    width:28px;
    height:28px;

    display:flex;
    align-items:center;
    justify-content:center;

    flex-shrink:0;

    border-radius:9px;

    background:
        rgba(75,180,255,.07);

    border:
        1px solid
        rgba(75,180,255,.13);

    font-size:15px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    body{
        padding:
            7px 6px 18px;
    }

    .page{
        min-height:
            calc(100vh - 25px);

        align-items:flex-start;

        padding-top:6px;
    }

    .card{
        padding:
            24px 16px 22px;

        border-radius:27px;
    }

    .logo-ring{
        width:82px;
        height:82px;

        border-radius:25px;
    }

    .logo{
        border-radius:20px;
        font-size:35px;
    }

    .title{
        font-size:30px;
    }

    .subtitle{
        font-size:13px;
        margin-bottom:19px;
    }

    .input{
        height:54px;
        font-size:15px;
    }

    .eye{
        width:46px;
        height:46px;
    }

    .update{
        height:55px;
        font-size:16px;
    }

    .login{
        min-height:53px;
    }
}

</style>
</head>


<body>

<div class="page">

<main class="card">

    <!-- LOGO -->

    <div class="logo-ring">
        <div class="logo">🔐</div>
    </div>


    <!-- BADGE -->

    <div class="badge">
        🛡️ TASKEARN • SECURE RECOVERY
    </div>


    <!-- TITLE -->

    <h1 class="title">
        Reset Password
    </h1>


    <p class="subtitle">
        Create a strong new password and
        keep your TaskEarn account protected.
    </p>


    <!-- NEW PASSWORD -->

    <label for="newPassword">
        New Password
    </label>

    <div class="input-wrap">

        <input
            id="newPassword"
            class="input"
            type="password"
            placeholder="Enter your new password"
            autocomplete="new-password"
            maxlength="72"
        >

        <button
            id="newEye"
            class="eye"
            type="button"
            aria-label="Show password"
            aria-pressed="false"
        >

            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <path
                    d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"
                ></path>

                <circle
                    cx="12"
                    cy="12"
                    r="3"
                ></circle>
            </svg>

        </button>

    </div>


    <!-- STRENGTH -->

    <div
        id="strength"
        class="strength"
    >

        <div class="strength-bars">

            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>

        </div>

        <div
            id="strengthText"
            class="strength-text"
        >
            Password strength
        </div>

    </div>


    <!-- CONFIRM -->

    <label for="confirmPassword">
        Confirm New Password
    </label>

    <div class="input-wrap">

        <input
            id="confirmPassword"
            class="input"
            type="password"
            placeholder="Re-enter your new password"
            autocomplete="new-password"
            maxlength="72"
        >

        <button
            id="confirmEye"
            class="eye"
            type="button"
            aria-label="Show password"
            aria-pressed="false"
        >

            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <path
                    d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"
                ></path>

                <circle
                    cx="12"
                    cy="12"
                    r="3"
                ></circle>
            </svg>

        </button>

    </div>


    <!-- MESSAGE -->

    <div
        id="message"
        class="message"
        aria-live="polite"
    ></div>


    <!-- UPDATE -->

    <button
        id="updateButton"
        class="update"
        type="button"
    >
         Update Password
    </button>


    <!-- LOGIN -->

    <button
        id="loginButton"
        class="login"
        type="button"
    >
        ← Back to Login
    </button>


    <!-- SECURITY -->

    <div class="security">

        <span class="security-icon">
            🛡️
        </span>

        <span>
            Your account security is protected by TaskEarn.
        </span>

    </div>

</main>

</div>


<!-- =====================================================
     SUPABASE LIBRARY
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =====================================================
   TASKEARN SUPABASE CONNECTION
   No ../js/supabase.js dependency
===================================================== */

"use strict";


const SUPABASE_URL =
    "https://wfvmipwesttejtvwoasj.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_o0R1owOtbfN-YaOsR_MzRg_lgbbqbvV";


let supabaseClient = null;


try{

    if(
        window.supabase &&
        typeof window.supabase.createClient ===
            "function"
    ){

        supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY,
                {
                    auth:{
                        persistSession:true,
                        autoRefreshToken:true,
                        detectSessionInUrl:true
                    }
                }
            );

    }

}catch(error){

    console.error(
        "TaskEarn Supabase error:",
        error
    );

}


/* =====================================================
   ELEMENTS
===================================================== */

const newPassword =
    document.getElementById(
        "newPassword"
    );


const confirmPassword =
    document.getElementById(
        "confirmPassword"
    );


const newEye =
    document.getElementById(
        "newEye"
    );


const confirmEye =
    document.getElementById(
        "confirmEye"
    );


const updateButton =
    document.getElementById(
        "updateButton"
    );


const loginButton =
    document.getElementById(
        "loginButton"
    );


const message =
    document.getElementById(
        "message"
    );


const strength =
    document.getElementById(
        "strength"
    );


const strengthText =
    document.getElementById(
        "strengthText"
    );


const bars =
    document.querySelectorAll(
        ".bar"
    );


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    type
){

    message.textContent =
        text;

    message.className =
        "message " +
        (type || "");

}


/* =====================================================
   EYE ICONS
===================================================== */

const eyeOpen = `
<svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"></path>
    <circle cx="12" cy="12" r="3"></circle>
</svg>
`;


const eyeClosed = `
<svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M3 3l18 18"></path>
    <path d="M10.6 6.2A10.8 10.8 0 0 1 12 6c6.5 0 10 6 10 6a18.7 18.7 0 0 1-3.1 3.8"></path>
    <path d="M6.2 6.2C3.5 8.1 2 12 2 12s3.5 6 10 6c1.5 0 2.8-.3 4-.8"></path>
    <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path>
</svg>
`;


/* =====================================================
   SHOW / HIDE PASSWORD
===================================================== */

function togglePassword(
    input,
    button
){

    const hidden =
        input.type === "password";


    if(hidden){

        input.type =
            "text";

        button.innerHTML =
            eyeClosed;

        button.classList.add(
            "active"
        );

        button.setAttribute(
            "aria-label",
            "Hide password"
        );

        button.setAttribute(
            "aria-pressed",
            "true"
        );

    }else{

        input.type =
            "password";

        button.innerHTML =
            eyeOpen;

        button.classList.remove(
            "active"
        );

        button.setAttribute(
            "aria-label",
            "Show password"
        );

        button.setAttribute(
            "aria-pressed",
            "false"
        );

    }

}


/* =====================================================
   EYE EVENTS
===================================================== */

newEye.addEventListener(
    "click",
    function(e){

        e.preventDefault();
        e.stopPropagation();

        togglePassword(
            newPassword,
            newEye
        );

    }
);


confirmEye.addEventListener(
    "click",
    function(e){

        e.preventDefault();
        e.stopPropagation();

        togglePassword(
            confirmPassword,
            confirmEye
        );

    }
);


/* =====================================================
   PASSWORD STRENGTH
===================================================== */

function updateStrength(
    password
){

    if(!password){

        strength.style.display =
            "none";

        bars.forEach(
            bar => {

                bar.style.background =
                    "rgba(255,255,255,.09)";

            }
        );

        return;
    }


    strength.style.display =
        "block";


    let score = 0;


    if(password.length >= 6)
        score++;


    if(password.length >= 10)
        score++;


    if(/[A-Z]/.test(password))
        score++;


    if(/[0-9]/.test(password))
        score++;


    if(/[^A-Za-z0-9]/.test(password))
        score++;


    let text;


    if(score <= 1){

        text =
            "Weak password";

    }else if(score <= 3){

        text =
            "Good password";

    }else{

        text =
            "Strong password ✓";

    }


    strengthText.textContent =
        text;


    bars.forEach(
        function(bar,index){

            if(
                index <
                Math.min(score,4)
            ){

                bar.style.background =
                    "#4ddcff";

            }else{

                bar.style.background =
                    "rgba(255,255,255,.09)";

            }

        }
    );

}


newPassword.addEventListener(
    "input",
    function(){

        updateStrength(
            this.value
        );

    }
);


/* =====================================================
   BACK TO LOGIN
===================================================== */

loginButton.addEventListener(
    "click",
    function(){

        window.location.href =
            "login.html";

    }
);


/* =====================================================
   RESET PASSWORD
===================================================== */

updateButton.addEventListener(
    "click",
    async function(){

        const password =
            newPassword.value.trim();


        const confirm =
            confirmPassword.value.trim();


        /* VALIDATION */

        if(password.length < 6){

            showMessage(
                "Password must be at least 6 characters.",
                "error"
            );

            newPassword.focus();

            return;
        }


        if(password !== confirm){

            showMessage(
                "Passwords do not match.",
                "error"
            );

            confirmPassword.focus();

            return;
        }


        if(!supabaseClient){

            showMessage(
                "Supabase failed to load. Please reload the page.",
                "error"
            );

            return;
        }


        /* LOADING */

        updateButton.disabled =
            true;

        updateButton.textContent =
            "Updating Password...";


        showMessage(
            "Securing your new password...",
            "info"
        );


        try{

            const {
                error
            } =
                await supabaseClient.auth.updateUser(
                    {
                        password:
                            password
                    }
                );


            if(error){

                console.error(
                    "Password update error:",
                    error
                );


                showMessage(
                    error.message ||
                    "Unable to update password.",
                    "error"
                );


                updateButton.disabled =
                    false;

                updateButton.textContent =
                    "🔐 Update Password";

                return;
            }


            /* SUCCESS */

            showMessage(
                "Password updated successfully! Opening Login...",
                "success"
            );


            updateButton.textContent =
                "Password Updated ✓";


            newPassword.value =
                "";

            confirmPassword.value =
                "";


            setTimeout(
                async function(){

                    try{

                        await supabaseClient.auth.signOut();

                    }catch(e){

                        console.log(e);

                    }


                    window.location.href =
                        "login.html";

                },
                1500
            );


        }catch(error){

            console.error(
                error
            );


            showMessage(
                "Something went wrong. Please try again.",
                "error"
            );


            updateButton.disabled =
                false;

            updateButton.textContent =
                "🔐 Update Password";

        }

    }
);


/* =====================================================
   ENTER KEY
===================================================== */

confirmPassword.addEventListener(
    "keydown",
    function(e){

        if(e.key === "Enter"){

            e.preventDefault();

            updateButton.click();

        }

    }
);


/* =====================================================
   INITIAL EYE ICONS
===================================================== */

newEye.innerHTML =
    eyeOpen;


confirmEye.innerHTML =
    eyeOpen;


/* =====================================================
   SUPABASE CHECK
===================================================== */

async function checkSupabase(){

    if(!supabaseClient){

        showMessage(
            "Supabase failed to load. Please reload the page.",
            "error"
        );

        return;
    }


    try{

        const {
            data,
            error
        } =
            await supabaseClient.auth.getSession();


        if(error){

            console.error(
                error
            );

            return;
        }


        /*
          No session usually means the page was opened
          directly instead of through the reset email link.
        */

        if(!data.session){

            showMessage(
                "Open the password reset link from your email first.",
                "info"
            );

        }

    }catch(error){

        console.error(
            "Session check:",
            error
        );

    }

}


/* =====================================================
   START
===================================================== */

checkSupabase();

</script>

</body>
</html>
