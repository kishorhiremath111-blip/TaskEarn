name: TaskEarn APK Build
on:
  workflow_dispatch:
  push:
    branches: ["master"]
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TaskEarn
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build release APK
        working-directory: android
        run: gradle --no-daemon clean assembleRelease

      - name: Sign release APK
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED="TaskEarn-v1.0.2-release.apk"
          KEYSTORE="$RUNNER_TEMP/taskearn-release.jks"
          ALIGNED="$RUNNER_TEMP/taskearn-release-aligned.apk"
          PASS="TaskEarnBuild-\${GITHUB_RUN_ID}-Safe"

          keytool -genkeypair -noprompt \
            -storetype JKS \
            -keystore "$KEYSTORE" \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -alias taskearn-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=TaskEarn, OU=TaskEarn, O=TaskEarn, L=India, ST=Maharashtra, C=IN"

          BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          ZIPALIGN="$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"

          "$ZIPALIGN" -f -P 16 -v 4 "$UNSIGNED" "$ALIGNED"

          KS_PASS="$PASS" "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-pass env:KS_PASS \
            --ks-key-alias taskearn-release \
            --out "$SIGNED" \
            "$ALIGNED"

          "$APKSIGNER" verify --verbose --min-sdk-version 23 "$SIGNED"
          rm -f "$ALIGNED" "$KEYSTORE"

      - name: Validate signed release APK
        shell: bash
        run: |
          set -euo pipefail
          APK="TaskEarn-v1.0.2-release.apk"
          BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          ZIPALIGN="$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          AAPT="$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt"

          "$ZIPALIGN" -c -P 16 -v 4 "$APK"
          "$APKSIGNER" verify --verbose --min-sdk-version 23 "$APK"

          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING"
          echo "$BADGING" | grep -q "package: name='com.taskearn.app'"
          echo "$BADGING" | grep -q "versionCode='3'"
          echo "$BADGING" | grep -q "versionName='1.0.2'"
          echo "$BADGING" | grep -q "application-label:'TaskEarn'"
          echo "$BADGING" | grep -q "sdkVersion:'23'"
          echo "$BADGING" | grep -q "targetSdkVersion:'35'"

          if echo "$BADGING" | grep -qi "testOnly='true'"; then
            echo "ERROR: testOnly=true"
            exit 1
          fi

          echo "=== APK SHA-256 ==="
          sha256sum "$APK"

      - name: Install test on Android 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            adb install -r TaskEarn-v1.0.2-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskEarn-release-APK
          path: TaskEarn-v1.0.2-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct APK release
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          TAG="taskearn-release-\${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "TaskEarn-v1.0.2-release.apk" \
            --title "TaskEarn Release APK \${GITHUB_RUN_NUMBER}" \
            --notes "Signed TaskEarn release APK build from commit \${GITHUB_SHA}. APK passed package/signature validation and Android 35 emulator install test." \
            --target "\${GITHUB_SHA}"
