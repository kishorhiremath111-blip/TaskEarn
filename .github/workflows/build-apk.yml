name: TaskEarn APK Build

on:
  workflow_dispatch:
  push:
    branches: ["master"]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout TaskEarn
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon clean assembleDebug

      - name: Validate APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          SDK="$ANDROID_HOME"
          BUILD_TOOLS="$(ls -1 "$SDK/build-tools" | sort -V | tail -n 1)"
          ZIPALIGN="$SDK/build-tools/$BUILD_TOOLS/zipalign"
          APKSIGNER="$SDK/build-tools/$BUILD_TOOLS/apksigner"
          AAPT="$SDK/build-tools/$BUILD_TOOLS/aapt"

          test -s "$APK"
          "$ZIPALIGN" -c -P 4 -v 4 "$APK"
          "$APKSIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" | head -n 25
          sha256sum "$APK"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: TaskEarn-installable-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
